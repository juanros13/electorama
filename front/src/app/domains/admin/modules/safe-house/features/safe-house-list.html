<div class="flex flex-auto flex-col gap-6 p-6">
  <app-page-header
    eyebrow="Defensa del voto"
    title="Casas seguras"
    subtitle="Ubicaciones registradas"
  />

  <!-- Map -->
  <div
    #mapEl
    class="h-72 w-full overflow-hidden rounded-xl border border-neutral-200 dark:border-neutral-800"
  ></div>

  <!-- Table -->
  <app-table-shell [loading]="loading()">
    <table
      mat-table
      matSort
      [dataSource]="dataSource"
      class="w-full"
    >
      <ng-container matColumnDef="alias">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Alias
        </th>
        <td
          mat-cell
          *matCellDef="let row"
        >
          {{ row.alias }}
        </td>
      </ng-container>

      <ng-container matColumnDef="manager">
        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Encargado
        </th>
        <td
          mat-cell
          *matCellDef="let row"
        >
          {{ row.managerName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="managerphone">
        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Teléfono
        </th>
        <td
          mat-cell
          *matCellDef="let row"
        >
          {{ row.managerPhone }}
        </td>
      </ng-container>

      <ng-container matColumnDef="reference">
        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Referencia
        </th>
        <td
          mat-cell
          *matCellDef="let row"
        >
          {{ row.reference }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="text-right"
        >
          Acciones
        </th>
        <td
          mat-cell
          *matCellDef="let row"
          class="text-right"
        >
          @if (isAdmin()) {
            <button
              matIconButton
              matTooltip="Eliminar"
              (click)="remove(row)"
            >
              <mat-icon svgIcon="trash-2" />
            </button>
          }
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
      ></tr>
    </table>

    @if (!loading() && dataSource.data.length === 0) {
      <div class="p-8 text-center text-neutral-500">
        No hay casas seguras registradas.
      </div>
    }

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[10, 25, 50]"
      showFirstLastButtons
    />
  </app-table-shell>
</div>

<div class="flex min-w-0 flex-auto flex-col">
  <!-- Header -->
  <div
    class="bg-card flex flex-col border-b p-6 sm:flex-row sm:items-center sm:justify-between sm:px-10 sm:py-8 dark:bg-transparent"
  >
    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center font-medium">
        <span class="text-primary whitespace-nowrap"
          >Modelo para la transformación de Tabasco</span
        >
        <mat-icon
          svgIcon="chevron-right"
          class="icon-size-5 text-secondary mx-1"
        />
        <span class="text-primary">INSTRUMENTOS</span>
      </div>
      <h2
        class="mt-2 truncate text-3xl font-extrabold tracking-tight md:text-4xl"
      >
        INSTRUMENTOS
      </h2>
    </div>
  </div>

  <div class="p-6 sm:p-10">
    <div class="bg-card rounded-lg border p-4 shadow-sm">
      @if (indicator(); as ind) {
        <h3 class="my-4 text-center text-xl font-semibold">
          {{ ind.indicatorNumber }} - {{ ind.description }}
        </h3>
      }
      <table
        mat-table
        [dataSource]="dataSource"
        class="w-full"
      >
        <ng-container matColumnDef="number">
          <th
            mat-header-cell
            *matHeaderCellDef
          >
            No.
          </th>
          <td
            mat-cell
            *matCellDef="let element"
          >
            <span
              class="bg-primary text-on-primary flex h-12 w-12 items-center justify-center rounded-full text-xl font-bold"
            >
              {{ element.indicatorNumber }}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th
            mat-header-cell
            *matHeaderCellDef
          >
            Descripción
          </th>
          <td
            mat-cell
            *matCellDef="let element"
          >
            <span class="text-lg">{{ element.description }}</span>
          </td>
        </ng-container>
        <tr
          mat-header-row
          *matHeaderRowDef="columns"
        ></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: columns"
        ></tr>
      </table>
      <mat-paginator
        [pageSize]="9"
        [pageSizeOptions]="[9, 18, 27]"
      />
    </div>
  </div>
</div>

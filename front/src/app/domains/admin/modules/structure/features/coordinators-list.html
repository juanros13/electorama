<div class="flex flex-auto flex-col gap-6 p-6">
  <app-page-header
    eyebrow="Estructura"
    title="Promotores"
    subtitle="Estructura territorial"
  >
    <button
      actions
      matButton="filled"
      (click)="goToAdd()"
    >
      <mat-icon svgIcon="plus" />
      Nuevo promotor
    </button>
  </app-page-header>

  <!-- Search -->
  <mat-form-field class="w-full">
    <mat-label>Buscar</mat-label>
    <input
      matInput
      [ngModel]="query()"
      (ngModelChange)="applyFilter($event)"
    />
    <mat-icon
      matSuffix
      svgIcon="search"
    />
  </mat-form-field>

  <!-- Table -->
  <app-table-shell [loading]="loading()">
    <table
      mat-table
      matSort
      [dataSource]="dataSource"
      class="w-full"
    >
      <ng-container matColumnDef="name">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Nombre
        </th>
        <td
          mat-cell
          *matCellDef="let row"
        >
          {{ row.fullname || row.firstName + ' ' + row.lastName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Correo
        </th>
        <td
          mat-cell
          *matCellDef="let row"
        >
          {{ row.email }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Estatus
        </th>
        <td
          mat-cell
          *matCellDef="let row"
        >
          @if (row.enabled) {
            <span class="text-emerald-600">Activo</span>
          } @else {
            <span class="text-red-600">Inactivo</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="text-right"
        >
          Acciones
        </th>
        <td
          mat-cell
          *matCellDef="let row"
          class="text-right"
        >
          @if (row.enabled) {
            <button
              matIconButton
              matTooltip="Inhabilitar"
              (click)="setStatus(row, false)"
            >
              <mat-icon svgIcon="user-round-x" />
            </button>
          } @else {
            <button
              matIconButton
              matTooltip="Habilitar"
              (click)="setStatus(row, true)"
            >
              <mat-icon svgIcon="user-round-check" />
            </button>
          }
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
      ></tr>
    </table>

    @if (!loading() && dataSource.data.length === 0) {
      <div class="p-8 text-center text-neutral-500">
        No hay promotores para mostrar.
      </div>
    }

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[10, 25, 50]"
      showFirstLastButtons
    />
  </app-table-shell>
</div>

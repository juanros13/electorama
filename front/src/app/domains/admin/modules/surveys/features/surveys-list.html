<div class="flex flex-auto flex-col gap-6 p-6">
  <app-page-header
    eyebrow="Censo 2024"
    title="Lista de censos por capturar"
  />

  <!-- Búsqueda -->
  <form (ngSubmit)="applySearch()">
    <mat-form-field class="w-full">
      <mat-label>Buscar</mat-label>
      <input
        matInput
        [ngModel]="search()"
        name="search"
        (ngModelChange)="search.set($event.toUpperCase())"
        maxlength="200"
      />
      <button
        matIconButton
        matSuffix
        type="submit"
        aria-label="Buscar"
      >
        <mat-icon svgIcon="search" />
      </button>
    </mat-form-field>
  </form>

  <!-- Tabla -->
  <app-table-shell [loading]="loading()">
    <table
      mat-table
      matSort
      matSortActive="id"
      matSortDirection="desc"
      [dataSource]="data()"
      class="w-full"
    >
      <ng-container matColumnDef="dispositivo">
        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Dispositivo
        </th>
        <td
          mat-cell
          *matCellDef="let row"
        >
          {{ row.deviceId }}
        </td>
      </ng-container>

      <ng-container matColumnDef="folio">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Folio
        </th>
        <td
          mat-cell
          *matCellDef="let row"
        >
          {{ row.surveyUserFolio?.folio }}
        </td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Fecha de la encuesta
        </th>
        <td
          mat-cell
          *matCellDef="let row"
        >
          {{ row.surveyDate | date: 'dd/MM/yyyy HH:mm' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="capturista">
        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Capturista
        </th>
        <td
          mat-cell
          *matCellDef="let row"
        >
          {{ row.surveyUser?.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="fotoIne">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="text-center"
        >
          Foto INE
        </th>
        <td
          mat-cell
          *matCellDef="let row"
          class="text-center"
        >
          <button
            matIconButton
            matTooltip="Ver foto INE"
            (click)="previewIne(row.pathPhotoIneAdverse)"
          >
            <mat-icon svgIcon="image" />
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="text-center"
        >
          Acciones
        </th>
        <td
          mat-cell
          *matCellDef="let row"
          class="text-center"
        >
          @if (!row.deleted) {
            <button
              matIconButton
              matTooltip="Capturar datos"
              (click)="capture(row)"
            >
              <mat-icon
                class="text-emerald-600"
                svgIcon="circle-plus"
              />
            </button>
          }
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
      ></tr>
    </table>

    @if (!loading() && data().length === 0) {
      <div class="p-8 text-center text-neutral-500">
        No hay censos por capturar.
      </div>
    }

    <mat-paginator
      [length]="resultsLength()"
      [pageSize]="15"
      [pageSizeOptions]="[15, 30, 100]"
      showFirstLastButtons
    />
  </app-table-shell>
</div>

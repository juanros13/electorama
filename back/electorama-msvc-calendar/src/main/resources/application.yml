spring:
  profiles:
    active: kubernetes
  application:
    name: electorama-msvc-calendar
server:
  port: 9001


google:
  secret:
    key:
      path: ${GOOGLE_CLIENT_SECRET_PATH:file:./secrets/client_secret_gd.json}
  oauth:
    callback:
      uri: ${GOOGLE_REDIRECT_URI:http://localhost:3873/calendar/authGoogle}

  credentials:
    folder:
      path: ${GOOGLE_CREDENTIALS_PATH:file:./secrets/google-tokens}


# expose all the spring boot actuators good for demos.
# NEVER DO THIS in production
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    #    restart:
    #      enabled: true # needed for spring cloud k8s so it can restart app when property values changes
    health:
      show-details: always
---
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_DATABASE:electorama}?currentSchema=calendar,public
    username: ${DB_USERNAME:electorama}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: calendar
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/electorama-realm}
---
spring:
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 5
  config:
    activate:
      on-profile: "!kubernetes"
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
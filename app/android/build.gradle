allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Workaround temporal: plugins antiguos (pre-AGP 8) no declaran `namespace`,
    // que AGP 8 exige. Lo inyectamos desde el group del proyecto para poder
    // compilar el baseline sin tocar las dependencias de Dart. Se registra ANTES
    // de evaluationDependsOn para evitar "project already evaluated".
    // Se quitará al actualizar los plugins.
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                if (namespace == null) {
                    namespace project.group.toString()
                }
            }
        }
    }

    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
